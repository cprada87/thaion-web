<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1284px; height: 2778px; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    .canvas { position: relative; width: 1284px; height: 2778px; overflow: hidden; display: flex; }
    .canvas::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 50% at 80% 45%, rgba(0,122,255,.22) 0%, transparent 65%), radial-gradient(ellipse 35% 35% at 20% 40%, rgba(0,122,255,.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .col-text { position: relative; z-index: 2; width: 560px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 60px 0 86px; }
    .app-title { font-size: 102px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: #f5f5f7; margin-bottom: 42px; }
    .feature-label { font-size: 25px; font-weight: 600; color: #0a84ff; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 20px; }
    .headline { font-size: 62px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; color: #f5f5f7; margin-bottom: 38px; }
    .description { font-size: 31px; line-height: 1.55; color: #98989d; max-width: 390px; }
    .col-device { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; justify-content: center; padding-right: 34px; }
    .col-device img { width: 544px; border-radius: 70px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 34px 104px rgba(0,122,255,.25), 0 10px 34px rgba(0,0,0,.8); }
    .footer-brand { position: absolute; bottom: 70px; left: 86px; font-size: 23px; color: #3a3a3c; letter-spacing: .02em; z-index: 2; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="col-text">
      <h1 class="app-title">MDReader</h1>
      <span class="feature-label">Editor</span>
      <h2 class="headline">Escribe en<br>Markdown</h2>
      <p class="description">Editor completo con resaltado<br>de sintaxis en vivo.</p>
    </div>
    <div class="col-device">
      <img src="../../AppStoreScreenshots/iPhone/3_iPhone17ProMax_ES.png" alt="" />
    </div>
    <span class="footer-brand">thaion.dev/mdreader</span>
  </div>
</body>
</html>
