<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 2778px; height: 1284px; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    .canvas { position: relative; width: 2778px; height: 1284px; overflow: hidden; display: flex; }
    .canvas::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 55% 80% at 72% 50%, rgba(0,122,255,.22) 0%, transparent 60%), radial-gradient(ellipse 30% 60% at 15% 50%, rgba(0,122,255,.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .col-text { position: relative; z-index: 2; width: 756px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 70px 0 104px; }
    .app-title { font-size: 84px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: #f5f5f7; margin-bottom: 34px; }
    .feature-label { font-size: 21px; font-weight: 600; color: #0a84ff; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 17px; }
    .headline { font-size: 58px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; color: #f5f5f7; margin-bottom: 30px; }
    .description { font-size: 27px; line-height: 1.55; color: #98989d; max-width: 540px; }
    .col-device { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; justify-content: center; padding-right: 52px; }
    .col-device img { width: 1764px; border-radius: 52px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 26px 86px rgba(0,122,255,.25), 0 7px 26px rgba(0,0,0,.8); }
    .footer-brand { position: absolute; bottom: 48px; left: 104px; font-size: 20px; color: #3a3a3c; letter-spacing: .02em; z-index: 2; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="col-text">
      <h1 class="app-title">MDReader</h1>
      <span class="feature-label">Vista Dividida</span>
      <h2 class="headline">Edita y<br>Previsualiza</h2>
      <p class="description">Edición y vista previa en paralelo.</p>
    </div>
    <div class="col-device">
      <img src="../../AppStoreScreenshots/iPhone/4_iPhone17ProMax_ES.png" alt="" />
    </div>
    <span class="footer-brand">thaion.dev/mdreader</span>
  </div>
</body>
</html>
