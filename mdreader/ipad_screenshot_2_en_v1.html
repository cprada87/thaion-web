<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 2732px; height: 2048px; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    .canvas { position: relative; width: 2732px; height: 2048px; overflow: hidden; display: flex; }
    .canvas::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 55% 80% at 74% 50%, rgba(0,122,255,.22) 0%, transparent 60%), radial-gradient(ellipse 28% 60% at 14% 50%, rgba(0,122,255,.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    .col-text { position: relative; z-index: 2; width: 820px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 80px 0 120px; }
    .app-title { font-size: 108px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: #f5f5f7; margin-bottom: 48px; }
    .feature-label { font-size: 30px; font-weight: 600; color: #0a84ff; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 24px; }
    .headline { font-size: 76px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; color: #f5f5f7; margin-bottom: 44px; }
    .description { font-size: 36px; line-height: 1.55; color: #98989d; max-width: 580px; }
    .col-device { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; justify-content: center; padding-right: 60px; }
    .col-device img { width: 1740px; border-radius: 36px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 32px 100px rgba(0,122,255,.25), 0 8px 32px rgba(0,0,0,.8); }
    .footer-brand { position: absolute; bottom: 64px; left: 120px; font-size: 26px; color: #3a3a3c; letter-spacing: .02em; z-index: 2; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="col-text">
      <h1 class="app-title">MDReader</h1>
      <span class="feature-label">Code</span>
      <h2 class="headline">Code and<br>Mermaid</h2>
      <p class="description">Syntax highlighting and Mermaid diagrams —<br>rendered natively, no JavaScript.</p>
    </div>
    <div class="col-device">
      <img src="../../AppStoreScreenshots/iPad/2_iPadPro_EN.png" alt="" />
    </div>
    <span class="footer-brand">thaion.dev/mdreader</span>
  </div>
</body>
</html>
